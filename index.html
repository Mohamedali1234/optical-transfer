<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpticDrop</title>
    
    <!-- Load the Decimen fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Hooks into the shared dark theme -->
    <link rel="stylesheet" href="./shared/style.css" />
    
    <style>
      /* --- Main Menu Custom Styling --- */
      
      /* Subtle blueprint/tech grid background */
      body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 32px 32px;
        opacity: 0.3;
        z-index: -1;
        pointer-events: none;
      }

      .hero {
        text-align: center;
        margin: 80px 0 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero .wordmark {
        font-size: 36px;
        letter-spacing: 0.08em;
      }

      .hero .subtitle {
        color: var(--teal);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        margin-top: 16px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 6px 12px;
        border-radius: 100px;
      }

      .menu-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 360px;
        margin: 0 auto;
      }

      /* High-tech panel buttons */
      .menu-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
      }

      .menu-btn:hover {
        background: var(--panel-2);
        transform: translateY(-2px);
      }

      /* Send Button Hover = Amber */
      .menu-btn.send:hover {
        border-color: var(--amber);
        box-shadow: 0 0 20px rgba(255, 184, 77, 0.15);
      }

      /* Receive Button Hover = Teal */
      .menu-btn.receive:hover {
        border-color: var(--teal);
        box-shadow: 0 0 20px rgba(77, 217, 192, 0.15);
      }

      /* Colored left-edge indicator on hover */
      .menu-btn::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: transparent;
        transition: background 0.25s;
      }
      .menu-btn.send:hover::before { background: var(--amber); }
      .menu-btn.receive:hover::before { background: var(--teal); }

      /* Animated arrow */
      .menu-btn .arrow {
        font-family: "JetBrains Mono", monospace;
        color: var(--text-dim);
        font-size: 18px;
        transition: color 0.25s, transform 0.25s;
      }
      .menu-btn:hover .arrow { transform: translateX(4px); }
      .menu-btn.send:hover .arrow { color: var(--amber); }
      .menu-btn.receive:hover .arrow { color: var(--teal); }

    </style>
  </head>
  <body>
    <main class="deck">
      <div class="hero">
        <div class="wordmark">OpticDrop<span class="dot">·</span></div>
        <div class="subtitle">Optical Transfer Protocol</div>
      </div>
      
      <div class="menu-container">
        <!-- Transmit Route -->
        <a href="./send/index.html" class="menu-btn send">
          Transmit File
          <span class="arrow">→</span>
        </a>
        
        <!-- Receive Route -->
        <a href="./receive/index.html" class="menu-btn receive">
          Receive Data
          <span class="arrow">→</span>
        </a>
      </div>
    </main>
  </body>
</html>
